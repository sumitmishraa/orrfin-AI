name: orrfin-platform

x-backend-env: &backend-env
  ORRFIN_ENV: ${ORRFIN_ENV:-development}
  DATABASE_URL: postgresql+psycopg://orrfin_app:${ORRFIN_APP_DB_PASSWORD:?run python tools/bootstrap_env.py first}@postgres:5432/orrfin
  ORRFIN_SECRET_KEY: ${ORRFIN_SECRET_KEY:?run python tools/bootstrap_env.py first}
  S3_ENDPOINT_URL: http://objectstore:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run python tools/bootstrap_env.py first}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?run python tools/bootstrap_env.py first}
  S3_BUCKET: orrfin-documents
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  ORRFIN_ALLOW_SIGNUP: ${ORRFIN_ALLOW_SIGNUP:-1}
  ORRFIN_AUTH_RATE_PER_MINUTE: ${ORRFIN_AUTH_RATE_PER_MINUTE:-20}
  ORRFIN_JOB_BACKOFF_SCALE: ${ORRFIN_JOB_BACKOFF_SCALE:-1}
  ORRFIN_ALLOW_MOCK_ERP: ${ORRFIN_ALLOW_MOCK_ERP:-1}
  MOCK_ERP_URL: http://mock-erp:9100
  ORRFIN_OCR_ENABLED: ${ORRFIN_OCR_ENABLED:-1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ORRFIN_AI_PROVIDER: ${ORRFIN_AI_PROVIDER:-}
  ORRFIN_AI_MODEL: ${ORRFIN_AI_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-${Gemini_API_KEY:-}}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  ORRFIN_DEMO_LOGIN: ${ORRFIN_DEMO_LOGIN:-1}
  TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
  HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
  HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-https://api.hindsight.vectorize.io}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orrfin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python tools/bootstrap_env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orrfin"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=20", "-master.volumeSizeLimitMB=256"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?run python tools/bootstrap_env.py first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run python tools/bootstrap_env.py first}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "orrfin.migrate"]
    environment:
      <<: *backend-env
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/orrfin
      OWNER_DATABASE_URL: postgresql+psycopg://orrfin_owner:${ORRFIN_OWNER_DB_PASSWORD:?run python tools/bootstrap_env.py first}@postgres:5432/orrfin
      ORRFIN_OWNER_DB_PASSWORD: ${ORRFIN_OWNER_DB_PASSWORD}
      ORRFIN_APP_DB_PASSWORD: ${ORRFIN_APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "orrfin.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--workers", "2"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "orrfin.worker"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "orrfin.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mock-erp:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "mock_erp.app:app", "--host", "0.0.0.0", "--port", "9100", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "${ORRFIN_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "pytest", "tests", "-q", "--maxfail=20", "-p", "no:cacheprovider"]
    environment:
      <<: *backend-env
      ORRFIN_BASE_URL: http://gateway:80
      OWNER_DATABASE_URL: postgresql+psycopg://orrfin_owner:${ORRFIN_OWNER_DB_PASSWORD}@postgres:5432/orrfin
    depends_on:
      gateway:
        condition: service_healthy
      worker:
        condition: service_healthy
      mock-erp:
        condition: service_healthy

volumes:
  postgres-data:
  object-data:
